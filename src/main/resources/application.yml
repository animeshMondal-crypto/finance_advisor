spring:
  application:
    name: financeadvisor
  datasource:
    url: jdbc:postgresql://localhost:5432/finance_advisor
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  ai:
    google:
      genai:
        api-key: ${GOOGLE_GENAI_API_KEY}
        chat:
          options:
            model: gemini-3.5-flash-lite
            temperature: 0.3

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
